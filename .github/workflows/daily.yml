name: Daily reminder

on:
  schedule:
    - cron: "0 23 * * *" # 07:00 Singapore time (UTC+8); may start 5-15 min late
  workflow_dispatch:

permissions:
  contents: write # commits history.json back after each send

jobs:
  send:
    runs-on: ubuntu-latest
    # must outlast the worst case of slow Gemini retries (bot.py reflect()),
    # or the job gets killed before the no-AI fallback can send the texts
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache source datasets
        uses: actions/cache@v4
        with:
          path: .data-cache
          # the source URLs are version-pinned, so the content never changes
          key: datasets-v1
      - name: Send today's reminder
        run: python bot.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DATA_DIR: .data-cache
      - name: Record sent items
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history.json
          if ! git diff --cached --quiet; then
            git commit -m "Record sent ayah and hadith [skip ci]"
            git pull --rebase origin main
            git push
          fi
